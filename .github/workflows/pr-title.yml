name: pr-title

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >-
            The subject "{subject}" must start with a lower-case letter and must not end with a full stop.
